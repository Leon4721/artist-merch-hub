{% extends "base.html" %}

{% block title %}{{ product.title }}{% endblock %}

{% block content %}
<h1>{{ product.title }}</h1>

<p>{{ product.description }}</p>

<p><strong>Price:</strong> £{{ product.price }}</p>
<p><strong>Type:</strong> {{ product.product_type }}</p>

<hr>

<a href="{% url 'product_list' %}">← Back to Store</a>
{% endblock %}
