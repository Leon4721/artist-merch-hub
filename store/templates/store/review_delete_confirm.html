{% extends "base.html" %}

{% block title %}Delete Review{% endblock %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h1 class="h5">Delete your review for {{ product.title }}?</h1>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Delete</button>
      <a class="btn btn-outline-dark ms-2" href="{% url 'product_detail' product.id %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
